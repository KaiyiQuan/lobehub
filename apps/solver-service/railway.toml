# Railway service config. Set the service "Root Directory" to
# `apps/solver-service` so this file and the Dockerfile are at the build root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
